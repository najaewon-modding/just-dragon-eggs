name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release 1.0.1-mc26.1.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release jar
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Maintenance release for **Just Dragon Eggs**.

          ## Changes

          - Recorded Dragon Eggs now use the same Epic rarity as the vanilla Dragon Egg, so their item names are displayed in purple in tooltips.
          - Updated the README documentation.

          ## Requirements

          - Minecraft **26.1.2**
          - NeoForge **26.1.2.97**
          - Java **25**
          - Install the mod on both the client and server when playing multiplayer.
          EOF
          gh release create v1.0.1-mc26.1.2 \
            "build/libs/njw_just_dragon_eggs-1.0.1-mc26.1.2.jar" \
            --target "$GITHUB_SHA" \
            --title "Just Dragon Eggs 1.0.1-mc26.1.2" \
            --notes-file /tmp/release-notes.md
